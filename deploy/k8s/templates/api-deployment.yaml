apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__-api
  namespace: custom-apps
  labels:
    app.kubernetes.io/name: kust
    app.kubernetes.io/instance: __APP_NAME__
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: __APP_NAME__
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kust
        app.kubernetes.io/instance: __APP_NAME__
        app.kubernetes.io/component: api
    spec:
      hostAliases:
        - ip: "__USER_INFO_HOST_IP__"
          hostnames:
            - "__USER_INFO_HOST__"
      imagePullSecrets:
        - name: kust-harbor
      containers:
        - name: api
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: MONGODB_CONFIG_PATH
              value: /etc/kust/runtime/mongodb.txt
            - name: MONGODB_DATABASE
              value: __MONGODB_DATABASE__
            - name: OA_CONFIG_PATH
              value: /etc/kust/runtime/oa_auth.txt
            - name: OA_USER_INFO_URL
              value: __USER_INFO_URL__
            - name: KUST_PRESET_CONFIG_PATH
              value: /etc/kust/runtime/tj_config
            - name: KUST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: encryption-key
            - name: CORS_ORIGIN
              value: http://k8s.1oa.com.cn
            - name: FRONT_URL
              value: http://k8s.1oa.com.cn__BASE_PATH__
            - name: KUST_EXPOSE_LOCAL_RESET_CODES
              value: "false"
            - name: KUST_APP_HOSTING_ENABLED
              value: "true"
            - name: KUST_APP_DEFAULT_GATEWAY_NAME
              value: k8s-gateway
            - name: KUST_APP_DEFAULT_GATEWAY_NAMESPACE
              value: traefik-system
            - name: KUST_APP_DEFAULT_ROUTE_HOST
              value: k8s.1oa.com.cn
            - name: KUST_APP_ROUTE_PREFIX
              value: /apps
            - name: KUST_APP_HARBOR_REPOSITORY_PREFIX
              value: 10.17.158.118/kust-apps
            - name: KUST_APP_PROXY_IMAGE
              value: __PROXY_IMAGE__
            - name: KUST_APP_IMAGE_PULL_SECRET
              value: kust-harbor
            - name: KUST_APP_ALLOWED_NAMESPACES
              value: custom-apps
            - name: KUST_APP_ALLOWED_GIT_HOSTS
              value: gitlab.1oa.com.cn,github.com,gitlab.com
            - name: KUST_APP_CALLBACK_BASE_URL
              value: http://k8s.1oa.com.cn__BASE_PATH__
            - name: KUST_APP_CALLBACK_RESOLVE
              value: k8s.1oa.com.cn:80:10.17.158.71
            - name: KUST_APP_PUBLIC_VERIFY_URL
              value: http://traefik.traefik-system.svc.cluster.local
            - name: KUST_APP_ROLLOUT_TIMEOUT_SECONDS
              value: "900"
            - name: KUST_JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: jenkins-url
                  optional: true
            - name: KUST_JENKINS_APP_JOB
              value: kust_customer_apps/application-hosting
            - name: KUST_JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: jenkins-user
                  optional: true
            - name: KUST_JENKINS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: jenkins-api-token
                  optional: true
            - name: RUST_LOG
              value: kust_api=info,tower_http=info
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/kust/runtime
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: runtime-config
          secret:
            secretName: __RUNTIME_SECRET__
            items:
              - key: mongodb.txt
                path: mongodb.txt
              - key: oa_auth.txt
                path: oa_auth.txt
              - key: tj_config
                path: tj_config
