apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__-api
  namespace: custom-apps
  labels:
    app.kubernetes.io/name: kust
    app.kubernetes.io/instance: __APP_NAME__
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: __APP_NAME__
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kust
        app.kubernetes.io/instance: __APP_NAME__
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: kust-harbor
      containers:
        - name: api
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: MONGODB_CONFIG_PATH
              value: /etc/kust/runtime/mongodb.txt
            - name: MONGODB_DATABASE
              value: __MONGODB_DATABASE__
            - name: OA_CONFIG_PATH
              value: /etc/kust/runtime/oa_auth.txt
            - name: KUST_PRESET_CONFIG_PATH
              value: /etc/kust/runtime/tj_config
            - name: KUST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: encryption-key
            - name: CORS_ORIGIN
              value: http://k8s.1oa.com.cn
            - name: FRONT_URL
              value: http://k8s.1oa.com.cn__BASE_PATH__
            - name: KUST_EXPOSE_LOCAL_RESET_CODES
              value: "false"
            - name: RUST_LOG
              value: kust_api=info,tower_http=info
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/kust/runtime
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: runtime-config
          secret:
            secretName: __RUNTIME_SECRET__
            items:
              - key: mongodb.txt
                path: mongodb.txt
              - key: oa_auth.txt
                path: oa_auth.txt
              - key: tj_config
                path: tj_config
