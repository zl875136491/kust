services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-kust}
      KUST_ENCRYPTION_KEY: ${KUST_ENCRYPTION_KEY:-kust-local-development-key-change-me}
      LISTEN_ADDR: 0.0.0.0:8080
      CORS_ORIGIN: http://localhost:3000
      RUST_LOG: kust_api=info,tower_http=info
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo-data:
